<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✨ LuxeCart | Premium E-Commerce Experience</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #faf9ff 0%, #f0f2fa 100%);
            color: #1a1f36;
            min-height: 100vh;
        }

        /* Glassmorphic Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(99, 102, 241, 0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            background: none;
            color: #6366f1;
            font-size: 1.8rem;
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 60px;
            transition: all 0.25s ease;
            color: #334155;
        }

        .nav-btn i {
            font-size: 1.1rem;
        }

        .nav-btn:hover {
            background: #eef2ff;
            color: #4f46e5;
            transform: translateY(-2px);
        }

        .cart-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 6px;
            box-shadow: 0 2px 6px rgba(239,68,68,0.3);
        }

        .role-badge {
            background: #e2e8f0;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1e293b;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Hero Section for Catalog */
        .hero-section {
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            border-radius: 2rem;
            padding: 2rem 2rem;
            margin-bottom: 2.5rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 20px 35px -12px rgba(79,70,229,0.3);
        }

        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
        }

        /* Product Grid - Modern Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .product-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(2px);
            border-radius: 1.75rem;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.2);
            border-color: #cbd5e1;
            background: white;
        }

        .product-img {
            height: 200px;
            background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #4f46e5;
        }

        .product-info {
            padding: 1.3rem;
        }

        .product-title {
            font-weight: 800;
            font-size: 1.25rem;
            margin-bottom: 0.4rem;
        }

        .product-price {
            font-weight: 700;
            font-size: 1.4rem;
            color: #4f46e5;
            margin: 0.5rem 0;
        }

        .product-desc {
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .add-cart {
            width: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-cart:hover {
            transform: scale(0.97);
            background: linear-gradient(90deg, #4338ca, #6d28d9);
            box-shadow: 0 5px 15px rgba(79,70,229,0.4);
        }

        /* Panels Glass */
        .admin-panel, .cart-panel, .orders-panel {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 2rem;
            margin-top: 1.5rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        input, textarea, select {
            padding: 12px 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 60px;
            flex: 1;
            font-size: 0.9rem;
            transition: 0.2s;
            background: white;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.2);
        }

        button {
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
        }

        .btn-danger {
            background: linear-gradient(95deg, #ef4444, #dc2626);
        }

        .btn-outline {
            background: white;
            border: 1.5px solid #cbd5e1;
            color: #1f2937;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            border-radius: 1rem;
            overflow: hidden;
        }

        th {
            background: #f8fafc;
            padding: 14px;
            text-align: left;
            font-weight: 700;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eef2ff;
        }

        .status {
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 40px;
            background: #dbeafe;
            color: #1e40af;
            display: inline-block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            z-index: 1000;
            font-weight: 500;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .removeCartItem {
            background: #fee2e2;
            color: #dc2626;
            padding: 6px 12px;
            border-radius: 40px;
        }

        @media (max-width: 700px) {
            .navbar { flex-direction: column; align-items: stretch; padding: 1rem; }
            .hero-text h1 { font-size: 1.5rem; }
            .container { padding: 0 1rem; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">
        <i class="fas fa-crown"></i> 
        <span>LuxeCart</span>
    </div>
    <div class="nav-links">
        <button class="nav-btn" id="catalogBtn"><i class="fas fa-store"></i> Shop</button>
        <button class="nav-btn" id="cartBtn"><i class="fas fa-bag-shopping"></i> Cart <span id="cartCount" class="cart-badge">0</span></button>
        <button class="nav-btn" id="ordersBtn"><i class="fas fa-truck-fast"></i> Orders</button>
        <button class="nav-btn" id="adminBtn" style="display:none;"><i class="fas fa-shield-alt"></i> Admin</button>
        <button class="nav-btn" id="loginBtn"><i class="fas fa-user-circle"></i> Sign In</button>
        <button class="nav-btn" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> Exit</button>
        <span id="userRoleSpan" class="role-badge"></span>
    </div>
</div>
<div class="container" id="appContainer">
    <!-- Catalog View -->
    <div id="catalogView">
        <div class="hero-section">
            <div class="hero-text">
                <h1>Summer Essentials</h1>
                <p>Discover premium quality, curated just for you ✨</p>
            </div>
            <i class="fas fa-tag" style="font-size: 3rem; opacity: 0.8;"></i>
        </div>
        <div id="productList" class="product-grid">Loading amazing products...</div>
    </div>
    <!-- Cart View -->
    <div id="cartView" style="display:none;">
        <div class="cart-panel">
            <h2><i class="fas fa-shopping-bag"></i> Your Shopping Bag</h2>
            <div id="cartItemsList"></div>
            <div id="cartTotal" style="font-weight:800; margin-top:1.5rem; font-size:1.3rem;"></div>
            <button id="checkoutBtn" class="btn-primary" style="margin-top:1rem;"><i class="fas fa-lock"></i> Secure Checkout</button>
        </div>
    </div>
    <!-- Orders View -->
    <div id="ordersView" style="display:none;">
        <div class="orders-panel">
            <h2><i class="fas fa-clock"></i> My Order History</h2>
            <div id="ordersList"></div>
        </div>
    </div>
    <!-- Admin View -->
    <div id="adminView" style="display:none;">
        <div class="admin-panel">
            <h2><i class="fas fa-gem"></i> Admin Studio — Product Management</h2>
            <div class="form-row">
                <input type="text" id="prodName" placeholder="✨ Product name">
                <input type="number" id="prodPrice" placeholder="Price (USD)">
                <input type="text" id="prodDesc" placeholder="Short description">
                <button id="createProductBtn" class="btn-primary"><i class="fas fa-plus-circle"></i> Add Product</button>
            </div>
            <h3>📦 Manage Inventory</h3>
            <div id="adminProductsTable"></div>
            <hr style="margin: 2rem 0; border-color:#eef2ff;">
            <h3><i class="fas fa-chart-line"></i> All Customer Orders</h3>
            <div id="adminOrdersTable"></div>
        </div>
    </div>
</div>

<script>
    // ========== FULL STACK SIMULATION (MongoDB-ready structure, localStorage as persistent DB) ==========
    let currentUser = null;        // { id, email, role }
    let products = [];
    let orders = [];
    let nextProductId = 5, nextOrderId = 3;

    // ---------- Data Load / Persist ----------
    function loadDataFromStorage() {
        const storedProducts = localStorage.getItem("luxecart_products");
        const storedOrders = localStorage.getItem("luxecart_orders");
        if (storedProducts) {
            products = JSON.parse(storedProducts);
            nextProductId = products.length ? Math.max(...products.map(p=>p.id),0)+1 : 1;
        } else {
            products = [
                { id: 1, name: "Auric Wireless Headphones", price: 79.99, description: "Active noise cancellation, 40h battery" },
                { id: 2, name: "Spectre Mechanical Keyboard", price: 119.99, description: "RGB per-key, hot-swappable switches" },
                { id: 3, name: "Nebula 4K Monitor", price: 329.99, description: "27-inch IPS, HDR400, ultra-slim" },
                { id: 4, name: "ErgoLift Mouse", price: 39.99, description: "Vertical ergonomic, 4000 DPI" }
            ];
            nextProductId = 5;
        }
        if (storedOrders) orders = JSON.parse(storedOrders);
        else {
            orders = [
                { id: 1, userId: 2, items: [{productId:1, name:"Auric Wireless Headphones", price:79.99, quantity:1}], total:79.99, status:"delivered", createdAt: new Date().toISOString() },
                { id: 2, userId: 1, items: [{productId:2, name:"Spectre Mechanical Keyboard", price:119.99, quantity:1}], total:119.99, status:"shipped", createdAt: new Date().toISOString() }
            ];
            nextOrderId = 3;
        }
        // Seed default users
        if (!localStorage.getItem("luxecart_users")) {
            const defaultUsers = [
                { id: 1, email: "admin@luxecart.com", password: "admin123", role: "admin" },
                { id: 2, email: "michael@luxecart.com", password: "user123", role: "user" }
            ];
            localStorage.setItem("luxecart_users", JSON.stringify(defaultUsers));
        }
        persistAll();
    }

    function persistAll() {
        localStorage.setItem("luxecart_products", JSON.stringify(products));
        localStorage.setItem("luxecart_orders", JSON.stringify(orders));
        localStorage.setItem("luxecart_meta", JSON.stringify({ nextProductId, nextOrderId }));
    }

    // Cart helpers (per user)
    function getCartKey() { return currentUser ? `luxecart_cart_${currentUser.id}` : null; }
    function getCart() { if(!currentUser) return []; const raw = localStorage.getItem(getCartKey()); return raw ? JSON.parse(raw) : []; }
    function saveCart(cart) { if(currentUser) localStorage.setItem(getCartKey(), JSON.stringify(cart)); updateCartUI(); }
    
    function addToCart(productId, qty=1) {
        if(!currentUser) { showToast("🔐 Please login to add items", "info"); return false; }
        const product = products.find(p=>p.id === productId);
        if(!product) return false;
        let cart = getCart();
        const existing = cart.find(i=>i.productId === productId);
        if(existing) existing.quantity += qty;
        else cart.push({ productId, name: product.name, price: product.price, quantity: qty });
        saveCart(cart);
        showToast(`➕ ${product.name} added to bag`, "success");
        return true;
    }

    function updateCartUI() {
        const cartSpan = document.getElementById("cartCount");
        if(cartSpan && currentUser) {
            const cart = getCart();
            const total = cart.reduce((s,i)=>s+i.quantity,0);
            cartSpan.innerText = total;
        } else if(cartSpan) cartSpan.innerText = "0";
    }

    // Checkout
    function checkout() {
        if(!currentUser) { showToast("Please sign in to checkout"); return; }
        const cart = getCart();
        if(cart.length === 0) { showToast("Your bag is empty 🛒"); return; }
        const items = cart.map(i=>({ productId:i.productId, name:i.name, price:i.price, quantity:i.quantity }));
        const total = items.reduce((s,i)=> s + (i.price * i.quantity), 0);
        const newOrder = {
            id: nextOrderId++,
            userId: currentUser.id,
            items: items,
            total: total,
            status: "pending",
            createdAt: new Date().toISOString()
        };
        orders.push(newOrder);
        persistAll();
        localStorage.removeItem(getCartKey());
        updateCartUI();
        showToast(`✅ Order placed! Order #${newOrder.id}`, "success");
        renderCurrentView();
    }

    // Admin actions
    function adminCreateProduct(name, price, desc) {
        if(!currentUser || currentUser.role !== "admin") return;
        if(!name || !price) return showToast("Name and price required");
        const newProduct = { id: nextProductId++, name: name.trim(), price: parseFloat(price), description: desc.trim() || "" };
        products.push(newProduct);
        persistAll();
        renderAdminProducts();
        if(document.getElementById("catalogView").style.display !== "none") renderCatalog();
        showToast(`✨ ${newProduct.name} created!`);
    }
    function adminDeleteProduct(pid) {
        if(currentUser?.role !== "admin") return;
        products = products.filter(p=>p.id !== pid);
        persistAll();
        renderAdminProducts();
        renderCatalog();
        showToast("Product removed");
    }

    // Auth
    function login(email, password) {
        const users = JSON.parse(localStorage.getItem("luxecart_users") || "[]");
        const user = users.find(u=>u.email === email && u.password === password);
        if(user){
            currentUser = { id: user.id, email: user.email, role: user.role };
            sessionStorage.setItem("luxecart_session", JSON.stringify(currentUser));
            updateUIForUser();
            showToast(`Welcome back, ${currentUser.email} ✨`);
            renderCurrentView();
            return true;
        } else { showToast("Invalid email or password"); return false; }
    }
    function logout() { currentUser = null; sessionStorage.removeItem("luxecart_session"); updateUIForUser(); renderCurrentView(); showToast("Signed out 👋"); }
    function checkSession() {
        const sess = sessionStorage.getItem("luxecart_session");
        if(sess) { currentUser = JSON.parse(sess); updateUIForUser(); }
        else { currentUser = null; updateUIForUser(); }
    }
    function updateUIForUser() {
        const loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn");
        const adminBtn = document.getElementById("adminBtn"), roleSpan = document.getElementById("userRoleSpan");
        if(currentUser){
            loginBtn.style.display = "none";
            logoutBtn.style.display = "flex";
            roleSpan.innerText = `👑 ${currentUser.role.toUpperCase()}`;
            if(currentUser.role === "admin") adminBtn.style.display = "flex";
            else adminBtn.style.display = "none";
        } else {
            loginBtn.style.display = "flex";
            logoutBtn.style.display = "none";
            adminBtn.style.display = "none";
            roleSpan.innerText = "";
        }
        updateCartUI();
    }

    // ========== RENDERING VIEWS ==========
    let currentView = "catalog";
    function renderCurrentView() {
        if(currentView === "catalog") showCatalog();
        else if(currentView === "cart") showCart();
        else if(currentView === "orders") showOrders();
        else if(currentView === "admin") { if(currentUser?.role==="admin") showAdminPanel(); else { showCatalog(); currentView="catalog"; } }
    }
    function showCatalog(){
        document.getElementById("catalogView").style.display = "block";
        document.getElementById("cartView").style.display = "none";
        document.getElementById("ordersView").style.display = "none";
        document.getElementById("adminView").style.display = "none";
        renderCatalog();
    }
    function renderCatalog(){
        const container = document.getElementById("productList");
        if(products.length===0) { container.innerHTML = "<p style='padding:2rem'>✨ No products yet — Admin can add masterpieces.</p>"; return; }
        container.innerHTML = products.map(p=>`
            <div class="product-card">
                <div class="product-img"><i class="fas fa-gem"></i></div>
                <div class="product-info">
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-price">$${p.price.toFixed(2)}</div>
                    <div class="product-desc">${escapeHtml(p.description||'Premium quality')}</div>
                    <button class="add-cart" data-id="${p.id}"><i class="fas fa-shopping-cart"></i> Add to Bag</button>
                </div>
            </div>
        `).join("");
        document.querySelectorAll(".add-cart").forEach(btn => btn.addEventListener("click",(e)=>{
            addToCart(parseInt(btn.dataset.id),1);
        }));
    }
    function showCart(){
        document.getElementById("catalogView").style.display = "none";
        document.getElementById("cartView").style.display = "block";
        document.getElementById("ordersView").style.display = "none";
        document.getElementById("adminView").style.display = "none";
        if(!currentUser) { document.getElementById("cartItemsList").innerHTML = "<p>🔒 Login to view your bag</p>"; return; }
        const cart = getCart();
        if(cart.length===0){ document.getElementById("cartItemsList").innerHTML="<p>Your shopping bag feels light ✨ add some items</p>"; document.getElementById("cartTotal").innerHTML=""; return; }
        let html = `<table style="width:100%"><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>`;
        cart.forEach((item,idx)=>{
            const sub = item.price*item.quantity;
            html += `<tr><td><b>${escapeHtml(item.name)}</b></td><td>$${item.price}</td><td>${item.quantity}</td><td>$${sub.toFixed(2)}</td><td><button class="removeCartItem" data-index="${idx}" style="background:#fee2e2; border:none;">🗑️</button></td></tr>`;
        });
        const total = cart.reduce((s,i)=>s+(i.price*i.quantity),0);
        html += `</table>`;
        document.getElementById("cartItemsList").innerHTML = html;
        document.getElementById("cartTotal").innerHTML = `<strong>Total: $${total.toFixed(2)}</strong>`;
        document.querySelectorAll(".removeCartItem").forEach(btn=>btn.addEventListener("click",(e)=>{
            const idx = parseInt(btn.dataset.index);
            let c = getCart(); c.splice(idx,1); saveCart(c); showCart();
        }));
    }
    function showOrders(){
        document.getElementById("catalogView").style.display = "none";
        document.getElementById("cartView").style.display = "none";
        document.getElementById("ordersView").style.display = "block";
        document.getElementById("adminView").style.display = "none";
        if(!currentUser) { document.getElementById("ordersList").innerHTML = "<p>Login to view your orders</p>"; return; }
        const userOrders = orders.filter(o=>o.userId === currentUser.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        if(userOrders.length===0){ document.getElementById("ordersList").innerHTML = "<p>No orders yet. Start shopping 🛍️</p>"; return; }
        let html = `<div class="order-timeline">`;
        userOrders.forEach(o=>{
            html += `<div style="background:#fefefe; border-radius:1.5rem; padding:1.2rem; margin-bottom:1rem; border:1px solid #eef2ff;">
                        <div style="display:flex; justify-content:space-between;"><span><strong>Order #${o.id}</strong></span><span class="status">${o.status.toUpperCase()}</span></div>
                        <div>📅 ${new Date(o.createdAt).toLocaleDateString()}</div>
                        <div>💰 Total: $${o.total.toFixed(2)}</div>
                        <ul style="margin-top:10px; margin-left:20px;">${o.items.map(i=>`<li>${i.quantity} × ${escapeHtml(i.name)} — $${i.price}</li>`).join('')}</ul>
                     </div>`;
        });
        html += `</div>`;
        document.getElementById("ordersList").innerHTML = html;
    }
    function showAdminPanel(){
        if(!currentUser || currentUser.role !== "admin") return;
        document.getElementById("catalogView").style.display = "none";
        document.getElementById("cartView").style.display = "none";
        document.getElementById("ordersView").style.display = "none";
        document.getElementById("adminView").style.display = "block";
        renderAdminProducts();
        renderAdminOrders();
    }
    function renderAdminProducts(){
        const container = document.getElementById("adminProductsTable");
        if(products.length===0){ container.innerHTML="<p>No items yet</p>"; return; }
        let html = `</table><tr><th>ID</th><th>Name</th><th>Price</th><th>Action</th></tr>`;
        products.forEach(p=>{
            html += `<tr><td>${p.id}</td><td><strong>${escapeHtml(p.name)}</strong></td><td>$${p.price}</td><td><button class="delProdBtn" data-id="${p.id}" style="background:#fee2e2;color:#b91c1c;">Delete</button></td></tr>`;
        });
        container.innerHTML = html;
        document.querySelectorAll(".delProdBtn").forEach(btn=>btn.addEventListener("click",()=>adminDeleteProduct(parseInt(btn.dataset.id))));
    }
    function renderAdminOrders(){
        const container = document.getElementById("adminOrdersTable");
        const all = [...orders].reverse();
        let html = `<table><tr><th>OrderID</th><th>UserID</th><th>Total</th><th>Status</th><th>Date</th></tr>`;
        all.forEach(o=>{
            html += `<tr><td>#${o.id}</td><td>${o.userId}</td><td>$${o.total}</td><td>${o.status}</td><td>${new Date(o.createdAt).toLocaleDateString()}</td></tr>`;
        });
        container.innerHTML = html;
    }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}
    function showToast(msg){ let t = document.createElement("div"); t.className="toast"; t.innerHTML=`<i class="fas fa-sparkle"></i> ${msg}`; document.body.appendChild(t); setTimeout(()=>t.remove(),2500);}
    
    // Event binding
    function bindEvents(){
        document.getElementById("catalogBtn").onclick = ()=>{ currentView="catalog"; renderCurrentView(); };
        document.getElementById("cartBtn").onclick = ()=>{ currentView="cart"; renderCurrentView(); };
        document.getElementById("ordersBtn").onclick = ()=>{ currentView="orders"; renderCurrentView(); };
        document.getElementById("adminBtn").onclick = ()=>{ currentView="admin"; renderCurrentView(); };
        document.getElementById("loginBtn").onclick = ()=>{ const em = prompt("Email (admin@luxecart.com / michael@luxecart.com)"); const pw = prompt("Password (admin123 / user123)"); if(em && pw) login(em,pw); };
        document.getElementById("logoutBtn").onclick = ()=>{ logout(); };
        document.getElementById("checkoutBtn") && (document.getElementById("checkoutBtn").onclick = ()=>{ checkout(); renderCurrentView(); });
        document.getElementById("createProductBtn") && (document.getElementById("createProductBtn").onclick = ()=>{
            adminCreateProduct(document.getElementById("prodName").value, document.getElementById("prodPrice").value, document.getElementById("prodDesc").value);
            document.getElementById("prodName").value = ""; document.getElementById("prodPrice").value = ""; document.getElementById("prodDesc").value = "";
        });
    }
    // INIT
    loadDataFromStorage();
    checkSession();
    bindEvents();
    renderCatalog();
    updateCartUI();
    if(currentView==="catalog") showCatalog(); else renderCurrentView();
</script>
</body>
</html>
